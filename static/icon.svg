      <stop offset="1" stop-color="#ECE3D2"/>
    </linearGradient>
    <!-- inset rounded tile (≈11% margin, rx ≈20% of tile) -->
    <clipPath id="tile">
      <rect x="112" y="112" width="800" height="800" rx="160" ry="160"/>
    </clipPath>
  </defs>

