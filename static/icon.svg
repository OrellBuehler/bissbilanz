    silhouette with transparent surroundings. Regenerated by
    `bun scripts/generate-icons.mjs`.

    Same brand mark as the iOS icon: SF Pro "B" (Heavy) with a bite nipped from
    the upper-right and a calorie-blue (#3B82F6) crumb.
  -->
