default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: bunx prettier --write --ignore-unknown
        language: system
        types_or:
          - javascript
          - ts
          - svelte
          - css
          - json
          - yaml
          - markdown
          - html

      - id: eslint
        name: eslint
        entry: bunx eslint --no-warn-ignored
        language: system
        types_or:
          - ts
          - javascript
          - svelte

      - id: ktlint
        name: ktlint
        entry: ktlint
        language: system
        types:
          - kotlin
        # Auto-generated API DTOs are excluded from ktlint in Gradle
        # (build.gradle.kts), so exclude them here too for parity.
        exclude: /generated/

      - id: swiftformat
        name: swiftformat
        entry: bash -c 'command -v swiftformat >/dev/null 2>&1 && swiftformat --lint --config mobile/iosApp/.swiftformat || echo "swiftformat not installed, skipping"'
        language: system
        types:
          - swift

      - id: gitleaks
        name: gitleaks
        entry: gitleaks protect --staged --verbose --redact
        language: system
        pass_filenames: false

      - id: no-swallowed-exceptions
        name: no swallowed exceptions
        entry: perl scripts/check-swallowed-exceptions.pl
        language: system
        types_or:
          - kotlin
          - swift
          - ts
          - javascript
          - svelte

      - id: no-catalog-data
        name: no committed catalog datasets
        entry: >-
          bash -c 'if git diff --cached --name-only | grep -qE "^data/catalog/.*\.jsonl$";
          then echo "ERROR - catalog dataset files must not be committed (public repo)"; exit 1; fi'
        language: system
        pass_filenames: false

      # Pre-push: whole-project checks live here so pre-commit stays fast. CI
      # still typechecks everything.
      - id: verify-changed
        name: verify changed (prettier, eslint, related tests, svelte-check, api:check)
        entry: bun run verify:changed --base
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: ktlint-gradle
        name: ktlint (gradle, changed mobile modules)
        entry: scripts/verify/pre-push-kotlin.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
