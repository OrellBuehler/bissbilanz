repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: bunx prettier --write --ignore-unknown
        language: system
        types_or:
          - javascript
          - ts
          - svelte
          - css
          - json
          - yaml
          - markdown
          - html

      - id: svelte-check
        name: svelte-check
        entry: bash -c 'bun run paraglide:compile && bunx svelte-kit sync && bunx svelte-check --tsconfig ./tsconfig.json'
        language: system
        pass_filenames: false
        types_or:
          - ts
          - svelte

      - id: ktlint
        name: ktlint
        entry: ktlint
        language: system
        types:
          - kotlin
        # Auto-generated API DTOs are excluded from ktlint in Gradle
        # (build.gradle.kts), so exclude them here too for parity.
        exclude: /generated/

      - id: swiftformat
        name: swiftformat
        entry: bash -c 'command -v swiftformat >/dev/null 2>&1 && swiftformat --lint --config mobile/iosApp/.swiftformat || echo "swiftformat not installed, skipping"'
        language: system
        types:
          - swift

      - id: gitleaks
        name: gitleaks
        entry: gitleaks protect --staged --verbose --redact
        language: system
        pass_filenames: false

      - id: no-catalog-data
        name: no committed catalog datasets
        entry: >-
          bash -c 'if git diff --cached --name-only | grep -qE "^data/catalog/.*\.jsonl$";
          then echo "ERROR - catalog dataset files must not be committed (public repo)"; exit 1; fi'
        language: system
        pass_filenames: false
