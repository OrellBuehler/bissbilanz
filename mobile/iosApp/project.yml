name: Bissbilanz
options:
  bundleIdPrefix: com.bissbilanz
  deploymentTarget:
    iOS: '18.0'
    watchOS: '11.0'
  xcodeVersion: '16.2'

packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: 9.17.1

settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGNING_ALLOWED: 'NO'
    GENERATE_INFOPLIST_FILE: 'YES'
    # App extensions refuse to install without CFBundle(Short)Version(String),
    # and the extension's CFBundleVersion must match the host app's.
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    # Sentry DSN is injected at build time (e.g. `xcodebuild SENTRY_DSN=...`).
    # Empty default keeps Sentry disabled for local/CI debug builds.
    SENTRY_DSN: ''
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: 'YES'
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: 'YES'
    INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait'
    INFOPLIST_KEY_CFBundleDisplayName: Bissbilanz

targets:
  Bissbilanz:
    type: application
    platform: iOS
    sources:
      # Shared/ also compiles into the watch targets — snapshot model, macro
      # colors, WCSession payload types only (no App Group access, the watch
      # has its own). PhoneShared/ is the phone-only counterpart: App Group
      # SwiftData store, sync queue, domain models and QuickAddFoodIntent,
      # compiled into the app and the widget extension but NOT the watch.
      # Kept free of app-only deps (BissbilanzAPI, AuthManager, L10n,
      # PhoneWatchConnectivity) so it builds standalone in the widget
      # extension's process.
      - path: Bissbilanz
      - path: Shared
      - path: PhoneShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bissbilanz.ios
        # Link the KMP shared framework. Gradle builds it and stages it under
        # shared/build/xcode-frameworks/<configuration>/<sdk>/ (see the shared
        # iOS framework steps in mobile-ios.yml / mobile-release.yml).
        FRAMEWORK_SEARCH_PATHS:
          - '$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)'
        OTHER_LDFLAGS:
          - '-framework'
          - 'shared'
          # SQLDelight's native SQLite driver (SQLiter) inside the static shared
          # framework references libsqlite3 symbols the host app must resolve.
          - '-lsqlite3'
    info:
      path: Bissbilanz/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - bissbilanz
        NSCameraUsageDescription: 'Bissbilanz needs camera access to scan barcodes and nutrition labels, and to photograph your foods'
        NSHealthShareUsageDescription: 'Bissbilanz reads your weight and sleep data to track trends'
        NSHealthUpdateUsageDescription: 'Bissbilanz saves nutrition, weight and sleep data to Health'
        SentryDSN: $(SENTRY_DSN)
        # remote-notification: CloudKit delivers sync changes via silent
        # remote notifications. fetch: BGAppRefreshTask background pulls
        # (BackgroundRefresher) keep widgets fresh with server-side changes.
        UIBackgroundModes:
          - remote-notification
          - fetch
        # Identifiers BGTaskScheduler may register — must match
        # BackgroundRefresher.taskIdentifier or registration fails at launch.
        BGTaskSchedulerPermittedIdentifiers:
          - com.bissbilanz.ios.refresh
        # Only standard (exempt) HTTPS encryption is used, so declare no
        # non-exempt encryption — TestFlight then skips the per-build
        # export-compliance prompt that would otherwise block each upload.
        ITSAppUsesNonExemptEncryption: false
        # Fasting tracker Live Activity — without this Activity.request throws.
        # Timers are date-relative and advance on-device, so frequent-updates
        # (NSSupportsLiveActivitiesFrequentUpdates) is not needed.
        NSSupportsLiveActivities: true
    # properties must be declared here: xcodegen regenerates the entitlements
    # file on every `xcodegen generate` and would otherwise write it empty
    entitlements:
      path: Bissbilanz/Bissbilanz.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
          - group.com.bissbilanz
        # CloudKit mirroring of the Local-mode SwiftData store (see LocalStore).
        # The container must be created and its schema promoted to production in
        # the CloudKit dashboard before release; signed builds need a profile
        # that includes it.
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.bissbilanz.ios
        com.apple.developer.icloud-services:
          - CloudKit
        # Native Sign in with Apple. The capability must also be enabled on the
        # App ID in the developer portal, or signing fails with a profile
        # mismatch on this entitlement.
        com.apple.developer.applesignin:
          - Default
    dependencies:
      - framework: '../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)/shared.framework'
        embed: false
      - sdk: HealthKit.framework
      # App Intents (Siri / Shortcuts / Spotlight voice logging) + Spotlight
      # indexing of FoodEntity/RecipeEntity.
      - sdk: AppIntents.framework
      - sdk: CoreSpotlight.framework
      # Fasting Live Activity (FastingTimerManager / EndFastIntent).
      - sdk: ActivityKit.framework
      # Supplement reminders, scheduled on-device from each supplement's
      # reminderTimes. Local notifications only — no remote push, so no
      # aps-environment entitlement and nothing to add to UIBackgroundModes.
      # Deliberately NOT added to BissbilanzWidgets: an extension cannot own the
      # notification delegate, and letting it schedule would duplicate requests
      # against the app's shared 64-slot budget.
      - sdk: UserNotifications.framework
      - package: Sentry
      - target: BissbilanzWidgets
        embed: true
      # Phase 1 dependent companion: the watch app is embedded in the host iOS
      # app. Its version keys are inherited from the base MARKETING_VERSION /
      # CURRENT_PROJECT_VERSION so they match the host (required to install).
      - target: BissbilanzWatch
        embed: true

  BissbilanzWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: BissbilanzWidgets
      - path: Shared
      - path: PhoneShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bissbilanz.ios.widgets
        SKIP_INSTALL: 'YES'
    info:
      path: BissbilanzWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: BissbilanzWidgets/BissbilanzWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bissbilanz
        # NOT adding com.apple.developer.icloud-container-identifiers here:
        # automatic signing can't provision a profile for a capability the App
        # ID doesn't already have enabled in the Apple Developer Portal, and
        # this extension's App ID (com.bissbilanz.ios.widgets) doesn't have
        # iCloud enabled — adding it broke the v1.24.1 Archive step
        # ("Provisioning profile ... doesn't match the entitlements file's
        # value for the com.apple.developer.icloud-container-identifiers
        # entitlement"). Without it, a widget-extension quick-add
        # (QuickAddFoodIntent) in Local mode writes locally but its
        # LocalStore.makeContainerWithFallback call falls back to a plain
        # on-disk (non-CloudKit) configuration — the entry is never lost, it
        # just doesn't propagate to the user's other Apple devices until the
        # main app next runs and rewrites the snapshot. Re-add this (and
        # enable iCloud for the App ID in the portal first) if that gap needs
        # closing.
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      # QuickAddFoodIntent (interactive Button(intent:) quick-add).
      - sdk: AppIntents.framework
      # FastingLiveActivity (ActivityConfiguration + FastingActivityAttributes).
      - sdk: ActivityKit.framework

  # Apple Watch companion app (Phase 1). Modern SwiftUI App lifecycle — a
  # single watchOS application target (not the legacy WatchKit storyboard
  # two-target form). Compiles Shared/ for models/colors and a separate
  # BissbilanzWatchShared/ for code shared with its complication extension.
  BissbilanzWatch:
    type: application
    platform: watchOS
    deploymentTarget: '11.0'
    sources:
      - path: BissbilanzWatch
      - path: BissbilanzWatchShared
      # Shares CODE, not data: App Groups never cross devices, so the watch
      # gets WidgetSnapshot/MacroColors and the WCSession payload types this
      # way — never the phone's App Group.
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bissbilanz.ios.watchkitapp
    info:
      path: BissbilanzWatch/Info.plist
      properties:
        WKApplication: true
        # Dependent on the host iPhone app. The one-way switch to independent
        # (WKRunsIndependentlyOfCompanionApp) is a deliberate Phase 2 change.
        WKCompanionAppBundleIdentifier: com.bissbilanz.ios
        CFBundleDisplayName: Bissbilanz
        # Lets the complication's `bissbilanz://log` deep link open the watch app.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - bissbilanz
    entitlements:
      path: BissbilanzWatch/BissbilanzWatch.entitlements
      properties:
        # The watch's OWN App Group — shared between the watch app and its
        # complication on-device, fed exclusively by WatchConnectivity.
        com.apple.security.application-groups:
          - group.com.bissbilanz.watch
    dependencies:
      - target: BissbilanzWatchWidgets
        embed: true
      - sdk: WatchConnectivity.framework
      - sdk: WidgetKit.framework
      - sdk: WatchKit.framework

  # WidgetKit accessory widgets = watch complications (ClockKit is deprecated).
  BissbilanzWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: '11.0'
    sources:
      - path: BissbilanzWatchWidgets
      - path: BissbilanzWatchShared
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bissbilanz.ios.watchkitapp.widgets
        SKIP_INSTALL: 'YES'
    info:
      path: BissbilanzWatchWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: BissbilanzWatchWidgets/BissbilanzWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.bissbilanz.watch
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  BissbilanzTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BissbilanzTests
    dependencies:
      - target: Bissbilanz
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bissbilanz.ios.tests
        # `@testable import Bissbilanz` pulls in the app's own imports, and two
        # app files `import shared` — so the test target has to be able to
        # resolve the staged KMP framework too. Search paths are not inherited
        # from a target dependency, which is why running the suite for the
        # first time surfaced "unable to resolve module dependency: 'shared'".
        FRAMEWORK_SEARCH_PATHS:
          - '$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)'
