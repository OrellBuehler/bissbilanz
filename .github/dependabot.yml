version: 2
updates:
  # Bun (web app) — updates package.json AND bun.lock natively
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
    ignore:
      # TypeScript 7 dropped the classic JS compiler API, so tools that embed it
      # break: openapi-typescript (openapi-ts/openapi-typescript#2841) and
      # svelte-check, which still requires a TS 6 install next to TS 7. TS 7 is
      # wired up separately as the @typescript/native alias and drives
      # svelte-check via --tsgo; drop this ignore once both support TS 7 directly.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
    groups:
      # testcontainers core and its modules share types — bumping one
      # without the other breaks svelte-check (duplicate nested copies)
      testcontainers:
        patterns:
          - 'testcontainers'
          - '@testcontainers/*'

  # Gradle (Kotlin Multiplatform / Android)
  # Every mobile/** PR costs two macOS runner slots (iOS build + Swift CodeQL)
  # out of the five a personal account gets, so a burst of six single-dep PRs
  # queues every iOS job for an hour. One PR per week for the routine bumps;
  # majors stay separate so a breaking one doesn't hold the rest hostage.
  - package-ecosystem: 'gradle'
    directory: '/mobile'
    schedule:
      interval: 'weekly'
    groups:
      gradle-minor-patch:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  # GitHub Actions
  # One PR for all action bumps. codeql-action/init and /analyze must move
  # together — each one alone fails every Analyze job on a version mismatch.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'
