version: 2
updates:
  # Bun (web app) — updates package.json AND bun.lock natively
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      # testcontainers core and its modules share types — bumping one
      # without the other breaks svelte-check (duplicate nested copies)
      testcontainers:
        patterns:
          - 'testcontainers'
          - '@testcontainers/*'

  # Gradle (Kotlin Multiplatform / Android)
  - package-ecosystem: 'gradle'
    directory: '/mobile'
    schedule:
      interval: 'weekly'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
