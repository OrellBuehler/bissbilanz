name: Mobile Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: mobile-release
  cancel-in-progress: false

permissions: {}

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-android-${{ runner.os }}-${{ hashFiles('mobile/**/*.gradle*', 'mobile/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-android-${{ runner.os }}-

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/keystore.jks"

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release AAB
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          APP_VERSION: ${{ steps.version.outputs.tag }}
        run: ./gradlew androidApp:bundleRelease -PSENTRY_DSN="$SENTRY_DSN" -PAPP_VERSION="$APP_VERSION"

      - name: Upload release AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-aab
          path: mobile/androidApp/build/outputs/bundle/release/*.aab

      - name: Upload to Google Play (internal testing)
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.bissbilanz.android
          releaseFiles: mobile/androidApp/build/outputs/bundle/release/*.aab
          track: internal
          status: draft

  ios-release:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile/iosApp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # latest-stable Xcode, matching the iOS PR build (mobile-ios.yml).
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache Homebrew packages
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/xcodegen
          key: brew-xcodegen-${{ runner.os }}

      - name: Install XcodeGen
        # Link explicitly: a cache-restored Cellar makes `brew install` skip
        # linking, leaving xcodegen off PATH (see mobile-ios.yml).
        run: |
          brew install --formula xcodegen
          brew link --overwrite xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            RAW="$REF_NAME"
          else
            RAW="$INPUT_VERSION"
          fi
          # CFBundleShortVersionString must be a numeric x.y.z — strip a leading v.
          echo "marketing=${RAW#v}" >> "$GITHUB_OUTPUT"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set up App Store Connect API key
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          # xcodebuild cloud signing and `altool` both auto-discover the key at
          # ~/.appstoreconnect/private_keys/AuthKey_<KEY_ID>.p8
          echo "$API_KEY_BASE64" | openssl base64 -d \
            > ~/.appstoreconnect/private_keys/AuthKey_"$KEY_ID".p8

      - name: Inject team ID into ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" ExportOptions.plist \
            || /usr/libexec/PlistBuddy -c "Set :teamID $TEAM_ID" ExportOptions.plist

      - name: Archive
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
          BUILD_NUMBER: ${{ github.run_number }}
        # -allowProvisioningUpdates + the API key = cloud signing: Xcode creates
        # and manages the distribution cert and both app/widget profiles itself.
        # CODE_SIGNING_ALLOWED=YES overrides the project default (NO) used by the
        # unsigned PR/simulator build. The build number is the monotonic CI run
        # number, so every upload is unique within a marketing version; it is
        # applied to app and widget alike (their CFBundleVersion must match).
        run: |
          xcodebuild archive \
            -project Bissbilanz.xcodeproj \
            -scheme Bissbilanz \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Bissbilanz.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_"$KEY_ID".p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            SENTRY_DSN="$SENTRY_DSN"

      - name: Export IPA
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Bissbilanz.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_"$KEY_ID".p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        # altool can print "UPLOAD FAILED" (e.g. an icon with an alpha channel,
        # or an invalid signature) and still exit 0, which silently produces a
        # green run with no build in App Store Connect. Validate first, then
        # upload, and fail the step on a non-zero exit OR any error text.
        run: |
          set -o pipefail
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -n1)
          echo "IPA: $IPA"

          run_altool() {
            local action="$1" log="$2"
            if ! xcrun altool "$action" -f "$IPA" -t ios \
                  --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" 2>&1 | tee "$log"; then
              echo "::error::altool $action exited non-zero"
              return 1
            fi
            if grep -qiE 'UPLOAD FAILED|VALIDATE FAILED|VALIDATION_ERROR|error uploading|errors uploading|not (properly )?signed|alpha channel|Failed to (upload|validate)' "$log"; then
              echo "::error::altool $action reported errors (see log above)"
              return 1
            fi
          }

          echo "Validating $IPA"
          run_altool --validate-app "$RUNNER_TEMP/altool-validate.log"
          echo "Uploading $IPA"
          run_altool --upload-app "$RUNNER_TEMP/altool-upload.log"
          echo "Upload accepted by App Store Connect."

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-ipa
          path: ${{ runner.temp }}/export/*.ipa
