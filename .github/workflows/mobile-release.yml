name: Mobile Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        type: string
      # Lets one platform be retried on its own. Re-running a release's failed
      # jobs uses the workflow file from the tag, so picking up a fix on main
      # needs a dispatch — and without this, that would re-upload the other
      # platform under a fresh build number.
      platforms:
        description: 'Which apps to build and upload'
        required: false
        default: both
        type: choice
        options:
          - both
          - android
          - ios

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: mobile-release
  cancel-in-progress: false

permissions: {}

jobs:
  android-release:
    # `inputs` is unset on the release trigger, which always ships both.
    if: github.event_name != 'workflow_dispatch' || inputs.platforms != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-android-${{ runner.os }}-${{ hashFiles('mobile/**/*.gradle*', 'mobile/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-android-${{ runner.os }}-

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/keystore.jks"

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release AAB
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          APP_VERSION: ${{ steps.version.outputs.tag }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew androidApp:bundleRelease -PSENTRY_DSN="$SENTRY_DSN" -PAPP_VERSION="$APP_VERSION" -PBUILD_NUMBER="$BUILD_NUMBER"

      # Built and kept as an artifact, but deliberately not sent to Play yet: a
      # Wear OS app needs its own Play Console listing before it can be uploaded.
      - name: Build Wear OS release bundle
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION: ${{ steps.version.outputs.tag }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew wearApp:bundleRelease -PAPP_VERSION="$APP_VERSION" -PBUILD_NUMBER="$BUILD_NUMBER"

      - name: Upload release AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-aab
          path: mobile/androidApp/build/outputs/bundle/release/*.aab

      - name: Upload Wear OS release AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wear-release-aab
          path: mobile/wearApp/build/outputs/bundle/release/*.aab

      - name: Upload to Google Play (internal testing)
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.bissbilanz.android
          releaseFiles: mobile/androidApp/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
          # Without this, Play reuses the track's previous release name, so the
          # release reads as the previous version.
          releaseName: ${{ steps.version.outputs.tag }}

  ios-release:
    if: github.event_name != 'workflow_dispatch' || inputs.platforms != 'android'
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile/iosApp

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Enabling a capability on an App ID invalidates every profile issued for
      # it, and export signs manually against profiles kept in secrets — so a
      # capability change fails the job ~25 minutes in with a bare
      # "doesn't include the <entitlement> entitlement". Compare the stored
      # profiles against each target's entitlements first: a minute to fail, and
      # the message names its own fix.
      - name: Check provisioning profiles cover the app entitlements
        env:
          PROFILE_APP_BASE64: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
          PROFILE_WIDGET_BASE64: ${{ secrets.IOS_PROFILE_WIDGET_BASE64 }}
          PROFILE_WATCH_BASE64: ${{ secrets.IOS_PROFILE_WATCH_BASE64 }}
          PROFILE_WATCH_WIDGET_BASE64: ${{ secrets.IOS_PROFILE_WATCH_WIDGET_BASE64 }}
        run: |
          set -euo pipefail
          failed=0

          # <key> names out of an xml1 dump. plutil's json converter refuses
          # values JSON cannot represent (data, date), and a profile's
          # Entitlements dict can hold them.
          keys_of() {
            { grep -o '<key>[^<]*</key>' || true; } | sed 's/<[^>]*>//g' | sort -u
          }

          check() {
            local encoded="$1" entitlements="$2" label="$3"
            local prof="$RUNNER_TEMP/pf.mobileprovision" plist="$RUNNER_TEMP/pf.plist"
            echo "$encoded" | base64 -d > "$prof"
            security cms -D -i "$prof" > "$plist"

            local expires
            expires=$(plutil -extract ExpirationDate raw -o - "$plist" 2>/dev/null || true)
            if [ -n "$expires" ] && [ "$(date -u +%Y-%m-%d)" \> "${expires%%T*}" ]; then
              echo "::error::$label profile expired on $expires"
              failed=1
            fi

            # Every entitlement the target requests must be granted by the
            # profile; the profile carrying extras (aps-environment, ...) is fine.
            local requested granted missing
            requested=$(plutil -convert xml1 -o - "$entitlements" | keys_of)
            granted=$(plutil -extract Entitlements xml1 -o - "$plist" | keys_of)

            # Without this an unreadable profile yields an empty granted set,
            # which reads as "grants nothing" and reports every entitlement of
            # every target as missing.
            if [ -z "$granted" ]; then
              echo "::error::$label profile has no readable Entitlements dict"
              failed=1
              return
            fi

            missing=$(comm -23 <(echo "$requested") <(echo "$granted"))
            if [ -n "$missing" ]; then
              echo "::error::$label profile is missing entitlements: $(echo "$missing" | tr '\n' ' ')"
              failed=1
            else
              echo "ok: $label (expires $expires)"
            fi
          }

          check "$PROFILE_APP_BASE64" Bissbilanz/Bissbilanz.entitlements "app"
          check "$PROFILE_WIDGET_BASE64" BissbilanzWidgets/BissbilanzWidgets.entitlements "widgets"
          check "$PROFILE_WATCH_BASE64" BissbilanzWatch/BissbilanzWatch.entitlements "watch"
          check "$PROFILE_WATCH_WIDGET_BASE64" BissbilanzWatchWidgets/BissbilanzWatchWidgets.entitlements "watch widgets"

          if [ "$failed" -ne 0 ]; then
            echo "::error::Regenerate the affected profiles, then re-run this job: ASC_KEY_ID=... ASC_ISSUER_ID=... ASC_PRIVATE_KEY_PATH=... node scripts/ios/refresh-provisioning-profiles.mjs --apply"
            exit 1
          fi

      # latest-stable Xcode, matching the iOS PR build (mobile-ios.yml).
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Cache Homebrew packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/xcodegen
          key: brew-xcodegen-${{ runner.os }}

      - name: Install XcodeGen
        # Link explicitly: a cache-restored Cellar makes `brew install` skip
        # linking, leaving xcodegen off PATH (see mobile-ios.yml).
        run: |
          brew install --formula xcodegen
          brew link --overwrite xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1

      # The app links the KMP shared framework, so build and stage it for the
      # Release/device archive (mirrors mobile-ios.yml's debug/simulator steps).
      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle and Kotlin/Native dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
            ~/.konan
          key: gradle-ios-release-${{ runner.os }}-${{ hashFiles('mobile/**/*.gradle*', 'mobile/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-ios-release-${{ runner.os }}-

      - name: Build shared iOS framework (release, device)
        working-directory: mobile
        run: ./gradlew shared:linkReleaseFrameworkIosArm64

      - name: Stage shared framework for Xcode
        working-directory: mobile
        run: |
          SDK_NAME=$(xcrun --sdk iphoneos --show-sdk-version)
          DEST="shared/build/xcode-frameworks/Release/iphoneos${SDK_NAME}"
          mkdir -p "$DEST"
          cp -R shared/build/bin/iosArm64/releaseFramework/shared.framework "$DEST/"

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            RAW="$REF_NAME"
          else
            RAW="$INPUT_VERSION"
          fi
          # CFBundleShortVersionString must be a numeric x.y.z — strip a leading v.
          echo "marketing=${RAW#v}" >> "$GITHUB_OUTPUT"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set up App Store Connect API key
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          # xcodebuild cloud signing and `altool` both auto-discover the key at
          # ~/.appstoreconnect/private_keys/AuthKey_<KEY_ID>.p8
          echo "$API_KEY_BASE64" | openssl base64 -d \
            > ~/.appstoreconnect/private_keys/AuthKey_"$KEY_ID".p8

      - name: Inject team ID into ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" ExportOptions.plist \
            || /usr/libexec/PlistBuddy -c "Set :teamID $TEAM_ID" ExportOptions.plist

      - name: Archive
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
          BUILD_NUMBER: ${{ github.run_number }}
        # -allowProvisioningUpdates + the API key = cloud signing: Xcode creates
        # and manages the distribution cert and both app/widget profiles itself.
        # CODE_SIGNING_ALLOWED=YES overrides the project default (NO) used by the
        # unsigned PR/simulator build. The build number is the monotonic CI run
        # number, so every upload is unique within a marketing version; it is
        # applied to app and widget alike (their CFBundleVersion must match).
        run: |
          xcodebuild archive \
            -project Bissbilanz.xcodeproj \
            -scheme Bissbilanz \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Bissbilanz.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_"$KEY_ID".p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            SENTRY_DSN="$SENTRY_DSN"

      - name: Import distribution certificate and profiles
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_APP_BASE64: ${{ secrets.IOS_PROFILE_APP_BASE64 }}
          PROFILE_WIDGET_BASE64: ${{ secrets.IOS_PROFILE_WIDGET_BASE64 }}
          PROFILE_WATCH_BASE64: ${{ secrets.IOS_PROFILE_WATCH_BASE64 }}
          PROFILE_WATCH_WIDGET_BASE64: ${{ secrets.IOS_PROFILE_WATCH_WIDGET_BASE64 }}
        # Manual export signing needs our Apple Distribution identity in a
        # keychain and the App Store profiles installed where xcodebuild looks.
        # A throwaway keychain keeps the private key off the persistent runner.
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"

          CERT="$RUNNER_TEMP/dist.p12"
          echo "$DIST_CERT_P12_BASE64" | base64 -d > "$CERT"
          security import "$CERT" -k "$KEYCHAIN" -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$CERT"
          # Let codesign use the imported key without an interactive prompt, and
          # add our keychain to the search list (keeping the existing ones).
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')

          install_profile() {
            local tmp uuid
            tmp="$(mktemp "$RUNNER_TEMP"/prof.XXXXXX)"
            echo "$1" | base64 -d > "$tmp"
            uuid="$(security cms -D -i "$tmp" | plutil -extract UUID raw -o - -)"
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            cp "$tmp" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
            echo "installed profile $uuid"
          }
          install_profile "$PROFILE_APP_BASE64"
          install_profile "$PROFILE_WIDGET_BASE64"
          install_profile "$PROFILE_WATCH_BASE64"
          install_profile "$PROFILE_WATCH_WIDGET_BASE64"

          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Export IPA
        # Manual signing: export re-signs using the Apple Distribution identity
        # imported above and the profiles named in ExportOptions.plist. No
        # -allowProvisioningUpdates / API key here — that path used the flaky
        # cloud-managed distribution certificate.
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Bissbilanz.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"

      - name: Verify distribution signature
        # Fail fast and clearly if export did not produce a distribution-signed
        # app (altool would otherwise reject it ~40s later with a vaguer error).
        run: |
          set -euo pipefail
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -n1)
          unzip -q -o "$IPA" -d "$RUNNER_TEMP/verify"
          APP=$(ls -d "$RUNNER_TEMP"/verify/Payload/*.app | head -n1)
          AUTH=$(codesign -dvv "$APP" 2>&1 | grep '^Authority=' | head -n1 || true)
          echo "$AUTH"
          case "$AUTH" in
            *"Apple Distribution"*) echo "OK: distribution-signed" ;;
            *) echo "::error::Exported app is not distribution-signed: ${AUTH:-<none>}"; exit 1 ;;
          esac

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        # altool can print "UPLOAD FAILED" (e.g. an icon with an alpha channel,
        # or an invalid signature) and still exit 0, which silently produces a
        # green run with no build in App Store Connect. Validate first, then
        # upload, and fail the step on a non-zero exit OR any error text.
        run: |
          set -o pipefail
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -n1)
          echo "IPA: $IPA"

          run_altool() {
            local action="$1" log="$2"
            if ! xcrun altool "$action" -f "$IPA" -t ios \
                  --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" 2>&1 | tee "$log"; then
              echo "::error::altool $action exited non-zero"
              return 1
            fi
            # Drop altool's benign success lines ("No errors uploading
            # archive at ...") first — otherwise the "errors uploading"
            # pattern below matches them and fails a successful upload.
            if grep -viE 'No errors (uploading|validating)' "$log" \
                 | grep -qiE 'UPLOAD FAILED|VALIDATE FAILED|VALIDATION_ERROR|errors? (uploading|validating)|not (properly )?signed|alpha channel|Failed to (upload|validate)'; then
              echo "::error::altool $action reported errors (see log above)"
              return 1
            fi
          }

          echo "Validating $IPA"
          run_altool --validate-app "$RUNNER_TEMP/altool-validate.log"
          echo "Uploading $IPA"
          run_altool --upload-app "$RUNNER_TEMP/altool-upload.log"
          echo "Upload accepted by App Store Connect."

      - name: Upload IPA artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-ipa
          path: ${{ runner.temp }}/export/*.ipa
