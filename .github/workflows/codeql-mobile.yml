name: CodeQL (Mobile)

on:
  push:
    branches: [main]
    paths: [mobile/**, .github/workflows/codeql-mobile.yml]
  pull_request:
    branches: [main]
    paths: [mobile/**, .github/workflows/codeql-mobile.yml]
  schedule:
    - cron: '30 5 * * 1' # every Monday at 05:30 UTC

concurrency:
  group: codeql-mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  kotlin:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.1

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-android-${{ runner.os }}-${{ hashFiles('mobile/**/*.gradle*', 'mobile/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-android-${{ runner.os }}-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      # CodeQL extracts Kotlin by observing the compiler: the build cache must be
      # off so compilation actually runs, and the compiler must run in-process so
      # the tracer can see it (the Kotlin daemon escapes tracing).
      - name: Build Android app
        run: >
          ./gradlew --no-daemon --no-build-cache
          -Pkotlin.compiler.execution.strategy=in-process
          androidApp:assembleDebug

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:java-kotlin'

  swift:
    name: Analyze (swift)
    runs-on: macos-14
    # CodeQL traces the Swift compiler, so the build runs far slower than a
    # normal xcodebuild (~2-4 min) — successful runs land at 35-45 min. 60 was
    # too tight and an occasional slow runner tipped over it; 90 gives headroom.
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle and Kotlin/Native dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
            ~/.konan
          key: gradle-ios-${{ runner.os }}-${{ hashFiles('mobile/**/*.gradle*', 'mobile/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-ios-${{ runner.os }}-

      - name: Cache Homebrew packages
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Cellar/xcodegen
          key: brew-xcodegen-${{ runner.os }}

      - name: Install XcodeGen
        run: |
          # The macOS runner ships unused aws/tap and azure/bicep taps that
          # trigger untrusted-tap warnings as Homebrew moves to require tap
          # trust. We only need xcodegen from the core tap, so drop them.
          for tap in aws/tap azure/bicep; do
            brew untap "$tap" 2>/dev/null || true
          done
          brew install --formula xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1

      - name: Build shared iOS framework
        run: ./gradlew shared:linkDebugFrameworkIosSimulatorArm64

      - name: Stage shared framework for Xcode
        run: |
          SDK_NAME=$(xcrun --sdk iphonesimulator --show-sdk-version)
          DEST="shared/build/xcode-frameworks/Debug/iphonesimulator${SDK_NAME}"
          mkdir -p "$DEST"
          cp -R shared/build/bin/iosSimulatorArm64/debugFramework/shared.framework "$DEST/"

      - name: Generate Xcode project
        working-directory: mobile/iosApp
        run: xcodegen generate

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      - name: Build iOS app
        working-directory: mobile/iosApp
        run: |
          # Use a generic Simulator destination, not a named device: resolving
          # `name=iPhone 16,OS=latest` makes xcodebuild query/boot a specific
          # CoreSimulator device, which stalls indefinitely under CodeQL's build
          # tracer (hit the 60-min timeout). The staged shared.framework is the
          # arm64 simulator slice and the runner is arm64, so build arm64-only —
          # otherwise the generic destination also builds x86_64 and can't find a
          # slice. Mirrors the build in mobile-ios.yml.
          xcodebuild build \
            -project Bissbilanz.xcodeproj \
            -scheme Bissbilanz \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:swift'
