name: CodeQL (Mobile)

# Kotlin only. The Swift analysis lives in codeql-swift.yml with its own path
# filter: it traces the Swift compiler on a macOS runner for ~40-60 min, and
# GitHub caps personal accounts at 5 concurrent macOS jobs. Firing it for every
# mobile/** change (a Gradle bump, an Android-only fix) starved the queue for
# every other iOS job. Both jobs still run on every push to main and weekly.
#
# `shared/` stays in scope here: androidApp:assembleDebug compiles the shared
# module's commonMain + androidMain, which is where the shared Kotlin is
# analyzed. (iosMain is only ever compiled by Kotlin/Native, which neither
# extractor traces — it has never been in a CodeQL database.)

on:
  push:
    branches: [main]
    paths:
      - mobile/**
      - '!mobile/iosApp/**'
      - .github/workflows/codeql-mobile.yml
  pull_request:
    branches: [main]
    paths:
      - mobile/**
      - '!mobile/iosApp/**'
      - .github/workflows/codeql-mobile.yml
  schedule:
    - cron: '30 5 * * 1' # every Monday at 05:30 UTC

concurrency:
  group: codeql-mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  kotlin:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-android-${{ runner.os }}-${{ hashFiles('mobile/**/*.gradle*', 'mobile/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-android-${{ runner.os }}-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: java-kotlin
          build-mode: manual

      # CodeQL extracts Kotlin by observing the compiler: the build cache must be
      # off so compilation actually runs, and the compiler must run in-process so
      # the tracer can see it (the Kotlin daemon escapes tracing).
      - name: Build Android app
        run: >
          ./gradlew --no-daemon --no-build-cache
          -Pkotlin.compiler.execution.strategy=in-process
          androidApp:assembleDebug

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: '/language:java-kotlin'
