name: iOS Build & Test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths: [mobile/**]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event.pull_request.draft == false
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Xcode 26+ so the compiler(>=6.2)-gated Liquid Glass code compiles in CI
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle and Kotlin/Native dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
            ~/.konan
          key: gradle-ios-${{ runner.os }}-${{ hashFiles('mobile/**/*.gradle*', 'mobile/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-ios-${{ runner.os }}-

      - name: Cache Homebrew packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/xcodegen
          key: brew-xcodegen-${{ runner.os }}

      - name: Install XcodeGen
        # When the Cellar is restored from cache, `brew install` sees the formula
        # as already installed and skips linking, leaving xcodegen off PATH (so
        # `xcodegen generate` fails with command not found). Link explicitly so it
        # resolves on both fresh and cache-restored runs.
        run: |
          brew install --formula xcodegen
          brew link --overwrite xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1

      - name: Build shared iOS framework
        run: ./gradlew shared:linkDebugFrameworkIosSimulatorArm64

      # The shared module's unit tests — including the cross-language golden
      # vectors — otherwise only ever run on the JVM via the Android job. This is
      # the one place the Kotlin/Native binary the app actually links gets
      # exercised, where Double formatting, the timezone database and
      # Instant.parse can all behave differently.
      - name: Run shared Kotlin/Native tests
        run: ./gradlew shared:iosSimulatorArm64Test

      - name: Stage shared framework for Xcode
        run: |
          SDK_NAME=$(xcrun --sdk iphonesimulator --show-sdk-version)
          DEST="shared/build/xcode-frameworks/Debug/iphonesimulator${SDK_NAME}"
          mkdir -p "$DEST"
          cp -R shared/build/bin/iosSimulatorArm64/debugFramework/shared.framework "$DEST/"

      - name: Generate Xcode project
        working-directory: mobile/iosApp
        run: xcodegen generate

      - name: Build iOS app
        working-directory: mobile/iosApp
        run: |
          # The staged shared.framework is the arm64 simulator slice and the
          # runner is arm64, so build arm64-only — otherwise the generic
          # Simulator destination also builds x86_64 and can't find a slice.
          xcodebuild build \
            -project Bissbilanz.xcodeproj \
            -scheme Bissbilanz \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64

      # The suite (sync manager, migrator, repositories, quick-add writer,
      # schedule maths, view logic) existed and was structured to be runnable —
      # SyncManager.autoDrain and LocalStore.makeContainer(inMemory:) are
      # explicit test seams — but every workflow ran `xcodebuild build`, so
      # none of it ever executed. Compiling the test target is the blocking
      # gate: it deterministically catches exactly the rot the first run
      # surfaced (missing framework search paths, drifted call signatures).
      # Runs against whichever iPhone simulator the installed Xcode ships,
      # since the name changes with every Xcode release.
      - name: Build iOS tests
        working-directory: mobile/iosApp
        run: |
          DEVICE_ID=$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[]
             | select(.key | test("iOS"))
             | .value[]
             | select(.name | startswith("iPhone"))
             | .udid] | last')
          if [ -z "$DEVICE_ID" ] || [ "$DEVICE_ID" = "null" ]; then
            echo "No iPhone simulator available" >&2
            exit 1
          fi
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcodebuild build-for-testing \
            -project Bissbilanz.xcodeproj \
            -scheme Bissbilanz \
            -destination "id=$DEVICE_ID" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64

      # Blocking. It was reporting-only until the "Restarting after unexpected
      # exit" host crashes were root-caused (issue #501) from the xcresult
      # bundle uploaded below: every one of them was the debounced
      # WidgetSnapshotWriter task fetching through a finished test's
      # deallocated in-memory container, which is why the victim test drifted.
      #
      # Serial: every test is @MainActor and StubURLProtocol keys its stubs
      # and recorded requests in process-wide statics.
      - name: Run iOS unit tests
        working-directory: mobile/iosApp
        run: |
          xcodebuild test-without-building \
            -project Bissbilanz.xcodeproj \
            -scheme Bissbilanz \
            -destination "id=$DEVICE_ID" \
            -configuration Debug \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 3 \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64

      # A host crash leaves nothing in stdout — the signal, thread and
      # backtrace only exist in the result bundle, which is how #501 was
      # traced. Keep uploading it so the next one is diagnosable too.
      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ios-test-results
          path: mobile/iosApp/TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore
