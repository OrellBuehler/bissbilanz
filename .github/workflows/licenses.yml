name: Update Third-Party Licenses

on:
  push:
    branches: [main]
    paths:
      - package.json
      - bun.lock
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Both runs would push the same bot branch; the later one should win.
concurrency:
  group: update-licenses
  cancel-in-progress: false

jobs:
  update-licenses:
    name: Regenerate Licenses
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          token: ${{ secrets.LICENSES_PR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate license report
        run: |
          echo '{"name":"","version":"","description":"","repository":"","publisher":"","email":"","url":"","licenses":"","licenseFile":"","licenseText":""}' > /tmp/custom-format.json
          bunx license-checker --production --customPath /tmp/custom-format.json --json > /tmp/licenses.json
          bun scripts/generate-licenses.mjs /tmp/licenses.json

      - name: Format license file
        run: bunx prettier --write THIRD_PARTY_LICENSES.md

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet THIRD_PARTY_LICENSES.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # main only accepts changes through a pull request, so the regenerated file
      # goes to a bot branch and an open PR is created or refreshed. A PR opened
      # with GITHUB_TOKEN does not trigger CI; set LICENSES_PR_TOKEN (a PAT or
      # app token with contents + pull-requests write) to get checks on it.
      - name: Open or update pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.LICENSES_PR_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: chore/update-third-party-licenses
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add THIRD_PARTY_LICENSES.md
          git commit --no-verify -m "docs: update third-party licenses"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "docs: update third-party licenses" \
              --body "Regenerated \`THIRD_PARTY_LICENSES.md\` after a dependency change on main (${GITHUB_SHA})."
          fi
