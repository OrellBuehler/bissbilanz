name: Update Third-Party Licenses

on:
  push:
    branches: [main]
    paths:
      - package.json
      - bun.lock
  workflow_dispatch:

permissions:
  contents: write

# Two license runs pushing to main at once would race each other; the retry in
# the commit step only covers merges landing from elsewhere.
concurrency:
  group: update-licenses
  cancel-in-progress: false

jobs:
  update-licenses:
    name: Regenerate Licenses
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Full history: the commit step rebases onto main when a merge lands
          # mid-run, and a depth-1 clone has no merge base to rebase onto.
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate license report
        run: |
          echo '{"name":"","version":"","description":"","repository":"","publisher":"","email":"","url":"","licenses":"","licenseFile":"","licenseText":""}' > /tmp/custom-format.json
          bunx license-checker --production --customPath /tmp/custom-format.json --json > /tmp/licenses.json
          bun scripts/generate-licenses.mjs /tmp/licenses.json

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet THIRD_PARTY_LICENSES.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Format license file
        if: steps.diff.outputs.changed == 'true'
        run: bunx prettier --write THIRD_PARTY_LICENSES.md

      - name: Commit updated licenses
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add THIRD_PARTY_LICENSES.md
          git commit --no-verify -m "docs: update third-party licenses [skip ci]"
          # A merge landing while this job runs moves main out from under it and
          # the push is rejected, failing an otherwise fine run (twice on
          # 2026-08-31 during a batch of merges). Rebase onto whatever is on
          # main now and try again -- the commit only touches a generated file.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "could not push the updated licenses after 3 attempts" >&2
          exit 1
