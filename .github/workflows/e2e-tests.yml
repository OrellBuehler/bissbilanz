name: E2E Tests

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  e2e:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: e2e_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Seed test database
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/e2e_test
        run: bun run test:seed

      - name: Build app
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/e2e_test
          # Fallback: dependabot-triggered runs read the (empty) Dependabot
          # secrets store. The value only signs cookies for a throwaway CI
          # server with fake OIDC creds, so a dummy is fine there.
          SESSION_SECRET: ${{ secrets.E2E_SESSION_SECRET || 'e2e-test-only-session-secret-padded-to-32-chars' }}
          PUBLIC_APP_URL: http://localhost:4000
          INFOMANIAK_CLIENT_ID: fake
          INFOMANIAK_CLIENT_SECRET: fake
          INFOMANIAK_REDIRECT_URI: http://localhost:4000/oauth/callback
          TEST_MODE: 'true'
          TEST_AUTH_TOKEN: 'test-integration-token'
        run: bun run build

      - name: Start app
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/e2e_test
          SESSION_SECRET: ${{ secrets.E2E_SESSION_SECRET || 'e2e-test-only-session-secret-padded-to-32-chars' }}
          PUBLIC_APP_URL: http://localhost:4000
          ORIGIN: http://localhost:4000
          INFOMANIAK_CLIENT_ID: fake
          INFOMANIAK_CLIENT_SECRET: fake
          INFOMANIAK_REDIRECT_URI: http://localhost:4000/oauth/callback
          TEST_MODE: 'true'
          TEST_AUTH_TOKEN: 'test-integration-token'
          PORT: '4000'
        run: |
          nohup bun build/index.js > app.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:4000/api/health > /dev/null && exit 0
            sleep 1
          done
          cat app.log
          exit 1

      - name: Run Playwright tests (layout, flows, visual regression)
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/e2e_test
        run: scripts/e2e/run-in-docker.sh

      - name: App log
        if: failure()
        run: cat app.log

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-results-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30

      - name: Comment on PR
        if: always()
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### Playwright E2E Results

            ${{ job.status == 'success' && '✅ All tests passed' || '❌ Tests failed' }}

            [Download screenshots & report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
