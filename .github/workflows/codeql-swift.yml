name: CodeQL (Swift)

# Split out of codeql-mobile.yml so it only fires for iOS changes. The Swift
# extractor records the AST of the iosApp/ sources; shared.framework enters as
# a binary plus an ObjC header, and values crossing that boundary are unmodeled
# for every Swift query. So a shared/-only change cannot alter these results —
# it either still compiles (same AST) or fails to, and `iOS Build & Test`
# (paths: mobile/**) reports that ~50 min sooner than a traced build would.
# Pushes to main and the weekly schedule still analyze every commit.

on:
  push:
    branches: [main]
    paths: [mobile/iosApp/**, .github/workflows/codeql-swift.yml]
  pull_request:
    branches: [main]
    paths: [mobile/iosApp/**, .github/workflows/codeql-swift.yml]
  schedule:
    - cron: '30 5 * * 1' # every Monday at 05:30 UTC

concurrency:
  group: codeql-swift-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  swift:
    name: Analyze (swift)
    # Stays on macos-14 even though every other iOS job is on macos-15, and
    # macos-14 queues far worse (95 min before this job even started on
    # 2026-08-30). macos-15 was tried and reverted: Xcode 16.2 is on that image
    # at the same build (16C5032a), but its iOS 18.2 simulator runtime is not —
    # macos-15 ships 18.5, 18.6 and 26.0-26.2 — so the generic iOS Simulator
    # destination resolves to nothing and xcodebuild exits 70 with "iOS 18.2 is
    # not installed". Moving here means also moving off the 16.2 pin (16.4 is
    # the image default and matches iOS 18.5), which is a toolchain change, not
    # a runner change. Both images are 3-core/7 GB, so this is not about memory.
    runs-on: macos-14
    # CodeQL traces the Swift compiler, and the extractor re-does a full
    # type-check inside every swift-frontend invocation it wraps. That, not the
    # code, is the cost: the untraced job in mobile-ios.yml builds the same
    # scheme and destination in ~2 min, while a traced run takes ~40-50.
    #
    # So `-Xfrontend -warn-long-function-bodies` is the wrong tool here — there
    # is nothing slow to type-check. Measured breakdown of a 49-min traced run
    # (job 99276431786), for whoever looks next:
    #
    #   25m41s  emit-module for Bissbilanz    (one frontend call, 145 files)
    #   10m03s  SPM fetch of sentry-cocoa     (fixed: now resolved pre-trace)
    #    7m14s  emit-module for BissbilanzWidgets
    #    ~4m    everything else incl. queries
    #
    # The remaining lever is target count: Widgets/Watch recompile Shared/ and
    # PhoneShared/, so ~230 file-compiles cover 166 unique files.
    timeout-minutes: 150
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Select Xcode 16.2
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: '16.2'

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle and Kotlin/Native dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
            ~/.konan
          key: gradle-ios-${{ runner.os }}-${{ hashFiles('mobile/**/*.gradle*', 'mobile/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-ios-${{ runner.os }}-

      - name: Cache Homebrew packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Cellar/xcodegen
          key: brew-xcodegen-${{ runner.os }}

      - name: Install XcodeGen
        run: |
          # The macOS runner ships unused aws/tap and azure/bicep taps that
          # trigger untrusted-tap warnings as Homebrew moves to require tap
          # trust. We only need xcodegen from the core tap, so drop them.
          for tap in aws/tap azure/bicep; do
            brew untap "$tap" 2>/dev/null || true
          done
          brew install --formula xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1

      - name: Build shared iOS framework
        run: ./gradlew shared:linkDebugFrameworkIosSimulatorArm64

      - name: Stage shared framework for Xcode
        run: |
          SDK_NAME=$(xcrun --sdk iphonesimulator --show-sdk-version)
          DEST="shared/build/xcode-frameworks/Debug/iphonesimulator${SDK_NAME}"
          mkdir -p "$DEST"
          cp -R shared/build/bin/iosSimulatorArm64/debugFramework/shared.framework "$DEST/"

      - name: Generate Xcode project
        working-directory: mobile/iosApp
        run: xcodegen generate

      # Resolving sentry-cocoa costs ~10 min under CodeQL's tracer, which wraps
      # every process git spawns, against seconds untraced. Nothing is compiled
      # here, so doing it before init costs the database nothing.
      - name: Resolve Swift package dependencies
        working-directory: mobile/iosApp
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Bissbilanz.xcodeproj \
            -scheme Bissbilanz \
            -clonedSourcePackagesDirPath build/SourcePackages

      - name: Initialize CodeQL
        uses: github/codeql-action/init@a35ac6e6798d72df5475948b28efb89edc2e19ca # v4.37.9
        with:
          languages: swift
          build-mode: manual
          # The runner has 7 GB. Left to itself CodeQL claims 6144 MB, which
          # leaves nothing for swift-frontend — the emit-module pass for the app
          # target then dies with "hosted runner lost communication with the
          # server" ~90 min in — on PR #539 and on main alike (2026-08-30).
          ram: 4096

      - name: Build iOS app
        working-directory: mobile/iosApp
        run: |
          # Use a generic Simulator destination, not a named device: resolving
          # `name=iPhone 16,OS=latest` makes xcodebuild query/boot a specific
          # CoreSimulator device, which stalls indefinitely under CodeQL's build
          # tracer (hit the 60-min timeout). The staged shared.framework is the
          # arm64 simulator slice and the runner is arm64, so build arm64-only —
          # otherwise the generic destination also builds x86_64 and can't find a
          # slice. Mirrors the build in mobile-ios.yml.
          # -disableAutomaticPackageResolution keeps the tracer away from the
          # package fetch: it fails loudly if the pre-init resolve step did not
          # take, rather than quietly re-cloning sentry-cocoa for 10 minutes.
          xcodebuild build \
            -project Bissbilanz.xcodeproj \
            -scheme Bissbilanz \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@a35ac6e6798d72df5475948b28efb89edc2e19ca # v4.37.9
        with:
          category: '/language:swift'
