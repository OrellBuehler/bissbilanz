name: Mutation Testing

# Report-only: surviving mutants show where the unit tests would not notice a change
# in nutrient, recipe-math or offline-queue code. Never run on pull requests (a full
# run takes well over an hour) and never gates anything.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Run Stryker
        run: bun run test:mutation --concurrency 4

      - name: Mutation score summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f coverage/mutation/index.html ]; then
            echo "## Mutation testing" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Download the \`mutation-report\` artifact and open \`index.html\` for surviving mutants." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-report
          path: coverage/mutation/
          if-no-files-found: ignore
          retention-days: 30
