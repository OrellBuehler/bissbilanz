name: Build and Deploy

on:
  release:
    types: [published]

permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  # Publishing a release used to build and ship whatever the tag pointed at. The
  # tag can be cut from a commit whose PR checks were skipped or red, so the image
  # (and therefore the deploy) is gated on the unit tests and the type check.
  test:
    name: Test gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Compile i18n and sync SvelteKit
        run: bun run paraglide:compile && bunx svelte-kit sync

      - name: Typecheck (svelte-check)
        run: bunx svelte-check --tsconfig ./tsconfig.json --tsgo

      - name: Unit tests
        run: bun run test

  build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      previous_version: ${{ steps.previous.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set image name lowercase
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_HASH=${{ github.sha }}
            BUILD_TIMESTAMP=${{ github.event.release.created_at }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Record the release that is running now
        # The rollback target (config.app.version is the release tag baked into
        # the running image). Read before the push: the server deploys a new
        # `latest` on its own within two minutes of it.
        id: previous
        env:
          HEALTH_URL: https://bissbilanz.orellbuehler.ch/api/health
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          version=""
          if body=$(curl -fsS --max-time 10 "$HEALTH_URL" 2>/dev/null); then
            version=$(echo "$body" | jq -r 'select(.status == "ok") | .version // empty')
          fi
          if [ -z "$version" ] || [ "$version" = "$RELEASE_TAG" ]; then
            echo "::warning::No distinct previously running release found (got '${version}'); automatic rollback is unavailable for this deploy."
            version=""
          else
            echo "Currently running $version; it is the rollback target."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Push Docker image
        run: docker image push --all-tags ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}

  # There is no push to the server. docker-server's reconcile timer checks the
  # `latest` tag every two minutes; when it moved, it dumps the database (the new
  # container runs migrations on its first start), then pulls and restarts the
  # app. This job only watches the public site for the result and, if the
  # release does not come up, points `latest` back at the previous one.
  deploy:
    name: Verify rollout
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'
    timeout-minutes: 30
    # One rollout at a time, queued rather than cancelled: two releases
    # published back to back must be verified (and rolled back) in order.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      # The rollback re-points the `latest` tag at the previous release's image.
      packages: write
    env:
      REGISTRY: ghcr.io
      HEALTH_URL: https://bissbilanz.orellbuehler.ch/api/health
      RELEASE_TAG: ${{ github.ref_name }}
      PREVIOUS_VERSION: ${{ needs.build.outputs.previous_version }}

    steps:
      - name: Wait for the server to run the release
        # Polls GET /api/health, which does a cheap `SELECT 1` and reports the
        # running release via config.app.version (baked from the Dockerfile's
        # APP_VERSION build arg). Ten minutes covers the two-minute timer, the
        # pull, the database dump, the migrations and the container health wait.
        id: verify
        run: |
          set -euo pipefail
          echo "Waiting for $HEALTH_URL to report status=ok version=$RELEASE_TAG..."
          status="none"
          version="none"
          for attempt in $(seq 1 60); do
            if body=$(curl -fsS --max-time 5 "$HEALTH_URL" 2>curl.err); then
              status=$(echo "$body" | jq -r '.status // "none"')
              version=$(echo "$body" | jq -r '.version // "none"')
              echo "attempt $attempt/60: status=$status version=$version"
              if [ "$status" = "ok" ] && [ "$version" = "$RELEASE_TAG" ]; then
                echo "Deployment verified: $RELEASE_TAG is live."
                exit 0
              fi
            else
              echo "attempt $attempt/60: request failed: $(cat curl.err)"
            fi
            sleep 10
          done
          echo "::error::Timed out after 10 minutes waiting for $HEALTH_URL to report status=ok version=$RELEASE_TAG (last seen status=$status version=$version)."
          exit 1

      # --- Automatic rollback ------------------------------------------------
      # Runs when the release did not come up healthy. Compose runs
      # ghcr.io/<repo>:latest, so rolling back means pointing `latest` back at
      # the previous release's image; the server deploys it like any other new
      # `latest`. The database is not rolled back: migrations are
      # expand/contract (docs/api-stability.md), so the previous image runs
      # against the new schema; the server's pre-deploy dump is for anything
      # worse than that.
      - name: Roll back - set up image tools
        id: rollback_tools
        if: failure() && steps.verify.outcome == 'failure' && env.PREVIOUS_VERSION != ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Roll back - log in to Container Registry
        id: rollback_login
        if: failure() && steps.rollback_tools.outcome == 'success'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Roll back - point latest at the previous release
        id: rollback_retag
        if: failure() && steps.rollback_login.outcome == 'success'
        run: |
          set -euo pipefail
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          # docker/metadata-action tags releases with the semver, without the "v".
          previous_tag="${PREVIOUS_VERSION#v}"
          echo "Rolling back: $image:latest -> $image:$previous_tag"
          docker buildx imagetools inspect "$image:$previous_tag" > /dev/null
          docker buildx imagetools create --tag "$image:latest" "$image:$previous_tag"

      - name: Roll back - verify the previous release is live
        id: rollback_verify
        if: failure() && steps.rollback_retag.outcome == 'success'
        run: |
          set -uo pipefail
          for attempt in $(seq 1 60); do
            if body=$(curl -fsS --max-time 5 "$HEALTH_URL" 2>/dev/null); then
              status=$(echo "$body" | jq -r '.status // "none"')
              version=$(echo "$body" | jq -r '.version // "none"')
              echo "attempt $attempt/60: status=$status version=$version"
              if [ "$status" = "ok" ] && [ "$version" = "$PREVIOUS_VERSION" ]; then
                echo "::error::$RELEASE_TAG did not come up healthy and was rolled back to $PREVIOUS_VERSION (now live and healthy). This deploy is still marked failed."
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::Rollback to $PREVIOUS_VERSION did not become healthy within 10 minutes. Production needs manual attention."
          exit 1
