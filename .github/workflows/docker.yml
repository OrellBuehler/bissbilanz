name: Build and Deploy

on:
  release:
    types: [published]

permissions: {}

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set image name lowercase
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_HASH=${{ github.sha }}
            BUILD_TIMESTAMP=${{ github.event.release.created_at }}

      - name: Push Docker image
        run: docker image push --all-tags ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'

    steps:
      - name: Connect to home network via WireGuard
        env:
          WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard-tools
          umask 077
          printf '%s' "$WIREGUARD_CONFIG" | base64 -d | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo wg-quick up wg0

      - name: Deploy to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > deploy_key
          chmod 600 deploy_key
          ssh -i deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'deploy bissbilanz'

      - name: Verify production deployment
        # deploy-docker.sh forces "deploy <service>" as the only allowed
        # SSH_ORIGINAL_COMMAND for this key (see docker-server's authorized_keys
        # command= restriction), so this can't piggyback a curl on that SSH
        # session. It doesn't need to: bissbilanz.orellbuehler.ch is the live
        # public site (only the SSH management port is IP-restricted, per
        # deploy-connectivity.yml's tunnel), so hit it straight from the
        # runner. Polls GET /api/health, which does a cheap `SELECT 1` and
        # reports the running release via config.app.version (baked from the
        # Dockerfile's APP_VERSION build arg).
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          url="https://bissbilanz.orellbuehler.ch/api/health"
          echo "Waiting for $url to report status=ok version=$RELEASE_TAG..."
          status="none"
          version="none"
          for attempt in $(seq 1 18); do
            if body=$(curl -fsS --max-time 5 "$url" 2>/dev/null); then
              status=$(echo "$body" | jq -r '.status // "none"')
              version=$(echo "$body" | jq -r '.version // "none"')
              echo "attempt $attempt/18: status=$status version=$version"
              if [ "$status" = "ok" ] && [ "$version" = "$RELEASE_TAG" ]; then
                echo "Deployment verified: $RELEASE_TAG is live."
                exit 0
              fi
            else
              echo "attempt $attempt/18: request failed"
            fi
            sleep 10
          done
          echo "::error::Timed out after 3 minutes waiting for $url to report status=ok version=$RELEASE_TAG (last seen status=$status version=$version)."
          exit 1

      - name: Disconnect WireGuard
        if: always()
        run: sudo wg-quick down wg0 || true
