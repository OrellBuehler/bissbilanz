name: Docker PR Smoke Test

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read

env:
  IMAGE_TAG: bissbilanz-pr:${{ github.sha }}

jobs:
  docker-smoke-test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: bissbilanz
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=pr-${{ github.event.pull_request.number }}
            GIT_HASH=${{ github.sha }}
            BUILD_TIMESTAMP=${{ github.event.pull_request.updated_at }}

      # fflate's async zip() (account export) runs in a Worker; it silently
      # received undefined payloads on Bun 1.3.x, so exercise it on the image's
      # exact runtime rather than under vitest/Node.
      - name: Check fflate async zip on the image runtime
        run: |
          docker run --rm --entrypoint bun "$IMAGE_TAG" --smol -e '
            const { zip, strToU8 } = await import("fflate");
            // Small payloads pass even on the broken runtime; an export-sized one (many files, stored images) does not.
            const files = { "bissbilanz.json": strToU8(JSON.stringify(Array.from({ length: 20000 }, (_, i) => ({ id: i, name: "food " + i })))) };
            for (let i = 0; i < 8; i++) files["csv/" + i + ".csv"] = strToU8("a,b,c\n".repeat(5000));
            for (let i = 0; i < 12; i++) files["images/" + i + ".webp"] = [new Uint8Array(200000).map(() => Math.random() * 255), { level: 0 }];
            const out = await new Promise((res, rej) => zip(files, { level: 6 }, (e, d) => (e ? rej(e) : res(d))));
            if (!(out.length > 0)) throw new Error("empty zip");
            console.log("fflate async zip ok:", out.length, "bytes");
          '

      - name: Start container
        run: |
          docker run -d --name bissbilanz-smoke --network host \
            -e DATABASE_URL=postgres://test:test@127.0.0.1:5432/bissbilanz \
            -e SESSION_SECRET=test-session-secret-for-ci-not-a-real-secret \
            -e PUBLIC_APP_URL=http://127.0.0.1:3000 \
            -e INFOMANIAK_CLIENT_ID=fake \
            -e INFOMANIAK_CLIENT_SECRET=fake \
            -e INFOMANIAK_REDIRECT_URI=http://127.0.0.1:3000/oauth/callback \
            "$IMAGE_TAG"

      - name: Wait for container to become ready
        run: |
          for attempt in {1..30}; do
            if ! docker ps --filter name=bissbilanz-smoke --filter status=running | grep -q bissbilanz-smoke; then
              echo "Container exited before becoming ready"
              docker logs bissbilanz-smoke
              exit 1
            fi

            status_code="$(curl -sS -o /tmp/bissbilanz-health.json -w '%{http_code}' http://127.0.0.1:3000/api/auth/me || true)"
            if [ "$status_code" = "200" ]; then
              cat /tmp/bissbilanz-health.json
              exit 0
            fi

            sleep 2
          done

          echo "Container did not become ready in time"
          docker logs bissbilanz-smoke
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f bissbilanz-smoke
