name: Android Build & Test

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Path detection happens here instead of a workflow-level `paths:` filter: a
  # required check from a workflow that never starts stays "expected" forever
  # and blocks the PR. The gate job below always reports.
  changes:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            relevant:
              - 'mobile/**'
              - 'tests/fixtures/shared/**'
              - 'analytics-parity/**'

  build:
    needs: changes
    if: github.event.pull_request.draft == false && needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        # The legacy 'tools' package the action installs by default was removed
        # from the SDK repository (android-actions/setup-android#537), so the
        # default 'tools platform-tools' list makes sdkmanager exit 1.
        with:
          packages: platform-tools

      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-android-${{ runner.os }}-${{ hashFiles('mobile/**/*.gradle*', 'mobile/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-android-${{ runner.os }}-

      - name: Run ktlint
        run: ./gradlew shared:ktlintCheck androidApp:ktlintCheck wearApp:ktlintCheck wearProtocol:ktlintCheck

      - name: Build shared module
        run: ./gradlew shared:compileDebugKotlinAndroid

      - name: Build debug APK
        run: ./gradlew androidApp:assembleDebug

      - name: Build Wear OS debug APK
        run: ./gradlew wearApp:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: debug-apk
          path: mobile/androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14

  lint:
    needs: changes
    if: github.event.pull_request.draft == false && needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        # The legacy 'tools' package the action installs by default was removed
        # from the SDK repository (android-actions/setup-android#537), so the
        # default 'tools platform-tools' list makes sdkmanager exit 1.
        with:
          packages: platform-tools

      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-android-${{ runner.os }}-${{ hashFiles('mobile/**/*.gradle*', 'mobile/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-android-${{ runner.os }}-

      - name: Run Android lint
        run: ./gradlew androidApp:lintDebug

      - name: Run Wear OS lint
        run: ./gradlew wearApp:lintDebug

      - name: Run shared module tests
        run: ./gradlew shared:allTests

      - name: Run Android ViewModel unit tests
        run: ./gradlew androidApp:testDebugUnitTest

      - name: Run Wear OS unit tests
        run: ./gradlew wearProtocol:testDebugUnitTest wearApp:testDebugUnitTest

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: |
            mobile/androidApp/build/reports/tests/
            mobile/shared/build/reports/tests/
          retention-days: 7

  coverage:
    needs: changes
    if: github.event.pull_request.draft == false && needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: gradle-android-${{ runner.os }}-${{ hashFiles('mobile/**/*.gradle*', 'mobile/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-android-${{ runner.os }}-

      # Informational only: no coverage threshold fails the build. The task runs each
      # module's JVM unit tests with the Kover agent attached; generated OpenAPI code is
      # excluded in shared/build.gradle.kts.
      - name: Generate Kover coverage reports
        run: ./gradlew shared:koverXmlReportDebug shared:koverHtmlReportDebug androidApp:koverXmlReportDebug

      - name: Summarize coverage
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          reports = {
              "shared": "shared/build/reports/kover/reportDebug.xml",
              "androidApp": "androidApp/build/reports/kover/reportDebug.xml",
          }
          rows = ["## Kotlin coverage (Kover)", "", "| Module | Lines | Branches | Methods |", "| --- | --- | --- | --- |"]
          for module, path in reports.items():
              if not os.path.exists(path):
                  rows.append(f"| {module} | no report | | |")
                  continue
              counters = {c.get("type"): c for c in ET.parse(path).getroot().findall("counter")}

              def pct(kind):
                  c = counters.get(kind)
                  if c is None:
                      return "n/a"
                  missed, covered = int(c.get("missed")), int(c.get("covered"))
                  total = missed + covered
                  return f"{100 * covered / total:.1f}% ({covered}/{total})" if total else "n/a"

              rows.append(f"| {module} | {pct('LINE')} | {pct('BRANCH')} | {pct('METHOD')} |")
          text = "\n".join(rows)
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(text + "\n")
          PY

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kover-coverage
          path: |
            mobile/shared/build/reports/kover/
            mobile/androidApp/build/reports/kover/
          retention-days: 14

  # Always-reporting required check. Skipped jobs (draft PR, no relevant paths)
  # count as passing; a failed or cancelled one fails the gate.
  android-gate:
    if: always()
    permissions: {}
    needs: [changes, build, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require Android jobs to have passed or been skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE 'failure|cancelled'; then
            exit 1
          fi
