name: Migration Tests

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  # Path detection happens here instead of a workflow-level `paths:` filter: a
  # required check from a workflow that never starts stays "expected" forever
  # and blocks the PR. The gate job below always reports.
  changes:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            relevant:
              - 'drizzle/**'
              - 'src/lib/server/schema.ts'
              - 'scripts/test-migrations.ts'
              - 'scripts/seed-migration-test.ts'
              - '.github/workflows/migration-test.yml'

  migration-test:
    needs: changes
    if: github.event.pull_request.draft == false && needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: migration_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Test migrations
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/migration_test
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun scripts/test-migrations.ts

  # Always-reporting required check. Skipped jobs (draft PR, no relevant paths)
  # count as passing; a failed or cancelled one fails the gate.
  migration-gate:
    if: always()
    permissions: {}
    needs: [changes, migration-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require migration jobs to have passed or been skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE 'failure|cancelled'; then
            exit 1
          fi
