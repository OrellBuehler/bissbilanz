name: Quality

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Compile i18n and sync SvelteKit
        run: bun run paraglide:compile && bunx svelte-kit sync

      - name: Typecheck (svelte-check, warnings ratcheted)
        run: bun run check:svelte

      - name: Format check (prettier)
        run: bunx prettier --check .

      - name: Shared analytics constants up to date
        run: bun run constants:check

      - name: Analytics golden vectors up to date
        run: bun run analytics:check

      - name: Shared cross-platform fixtures up to date
        run: bun run shared:check

      - name: Unit tests with coverage
        run: bun run test:coverage

      - name: Diff coverage (changed lines >= 80%)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bun run test:coverage:diff

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            bun -e '
              const t = JSON.parse(await Bun.file("coverage/coverage-summary.json").text()).total;
              const rows = ["lines", "statements", "functions", "branches"].map(
                (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered} / ${t[k].total} |`
              );
              console.log(["## Unit test coverage", "", "| metric | covered | count |", "| --- | --- | --- |", ...rows].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Crawler tests
        if: ${{ hashFiles('crawler/package.json') != '' }}
        working-directory: crawler
        run: bun install && bun test

  lint:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Compile i18n and sync SvelteKit (type-aware lint needs both)
        run: bun run paraglide:compile && bunx svelte-kit sync

      - name: Lint (eslint)
        run: bun run lint
