name: Quality

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Compile i18n and sync SvelteKit
        run: bun run paraglide:compile && bunx svelte-kit sync

      - name: Typecheck (svelte-check)
        run: bunx svelte-check --tsconfig ./tsconfig.json

      - name: Format check (prettier)
        run: bunx prettier --check .

      - name: Shared analytics constants up to date
        run: bun run constants:check

      - name: Unit tests
        run: bun run test

      - name: Crawler tests
        if: ${{ hashFiles('crawler/package.json') != '' }}
        working-directory: crawler
        run: bun install && bun test
